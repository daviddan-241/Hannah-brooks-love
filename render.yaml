services:
  - type: web
    name: hannah-brooks-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack prepare pnpm@latest --activate && pnpm install && pnpm --filter @workspace/db run push && VITE_ADMIN_ONLY=true BASE_PATH=/ pnpm --filter @workspace/hannah-brooks run build && BASE_PATH=/studio/ pnpm --filter @workspace/ai-persona run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hannah-brooks-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAYML_API_KEY
        sync: false

  - type: web
    name: hannah-brooks-fan-app
    runtime: static
    plan: free
    region: oregon
    buildCommand: corepack prepare pnpm@latest --activate && pnpm install && BASE_PATH=/ pnpm --filter @workspace/hannah-brooks run build
    staticPublishPath: ./artifacts/hannah-brooks/dist/public
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: hannah-brooks-ai-persona
    runtime: static
    plan: free
    region: oregon
    buildCommand: corepack prepare pnpm@latest --activate && pnpm install && pnpm --filter @workspace/ai-persona run build
    staticPublishPath: ./artifacts/ai-persona/dist/public
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: hannah-brooks-db
    plan: free
    region: oregon
